
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
    <script src="{{ url_for('static', filename='hls.js') }}"></script>
</head>
<body>
	<video controls autoplay muted playsinline width="100%" height="100%" id="video"></video>

    <script>
        const source = {{ url_for('static', filename='output.m3u8')|tojson }};
        const video = document.getElementById('video');
        const reloadMs = Math.max(10000, {{ time_to_reload }});

        if (window.Hls && Hls.isSupported()) {
            const hls = new Hls();
            hls.on(Hls.Events.ERROR, (_, data) => {
                console.error('HLS error', data);
                if (!data.fatal) {
                    return;
                }
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                } else {
                    location.reload();
                }
            });
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play().catch(() => {});
            });
            hls.loadSource(source);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = source;
            video.play().catch(() => {});
        } else {
            console.error('HLS is not supported in this browser');
        }

        setInterval(() => location.reload(), reloadMs);
    </script>
</body>
</html>
